backend:
  name: github
  repo: ysl6323/Personal-Website-ShanglinYuan
  branch: main

media_folder: public/images/notes
public_folder: images/notes

collections:
  - name: notes
    label: 随笔 Notes
    label_singular: 随笔
    folder: src/content/notes
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { name: title, label: 标题 Title, widget: string }
      - name: date
        label: 日期 Date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
      - name: category
        label: 分类 Category
        widget: select
        options:
          - { label: 'Notes · 学习笔记', value: notes }
          - { label: 'Radar · 前沿调研', value: radar }
          - { label: 'Life · 生活随笔', value: life }
        default: notes
      - { name: summary, label: 摘要 Summary, widget: string, required: false, hint: 列表页展示的一句话摘要 }
      - { name: tags, label: 标签 Tags, widget: list, required: false, hint: 回车添加一个标签 }
      - { name: body, label: 正文 Body, widget: markdown }

  - name: papers
    label: 论文 Papers
    label_singular: 论文
    folder: src/content/papers
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, label: 标题 Title, widget: string }
      - { name: authors, label: 作者 Authors, widget: list, hint: 按顺序，每位作者一行 }
      - { name: highlight, label: 高亮作者 Highlight, widget: string, default: Shanglin Yuan }
      - { name: venue, label: 发表 Venue, widget: string, default: arXiv preprint }
      - { name: year, label: 年份 Year, widget: number, value_type: int }
      - { name: arxiv, label: arXiv 链接, widget: string, required: false }
      - { name: code, label: Code 链接, widget: string, required: false }
      - { name: project, label: Project 链接, widget: string, required: false }
      - { name: hf, label: Hugging Face 链接, widget: string, required: false }
      - name: teaser
        label: 配图 Teaser
        widget: string
        required: false
        hint: 相对 public 的路径，如 images/papers/xxx.png
      - { name: order, label: 排序 Order, widget: number, value_type: int, default: 0, hint: 数字越小越靠前 }
      - { name: tags, label: 标签 Tags, widget: list, required: false }
      - { name: abstract, label: 摘要 Abstract, widget: text }
      - { name: bibtex, label: BibTeX, widget: text, required: false }
